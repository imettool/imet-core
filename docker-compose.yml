name: 'imet-core-dev-env'

services:

    php:
        build:
            dockerfile: docker/php.dockerfile
            args:
                - COMPOSER_GITHUB_TOKEN=${COMPOSER_GITHUB_TOKEN}
                - UID=${UID-}
        image: imet-core_php_image
        restart: unless-stopped
        volumes:
            - ./dev/:/var/www/html
            - ./:/var/www/html/package/imet-core
            - /var/www/html/package/imet-core/dev   # exclude dev from mounted

    nginx:
        image: nginx:stable-alpine
        restart: unless-stopped
        ports:
            - "${HTTP_PORT}:80"
        volumes:
            - ./dev/:/var/www/html
            - ./:/var/www/html/package/imet-core
            - /var/www/html/package/imet-core/dev   # exclude dev from mounted
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
            - ./docker/logs/nginx:/var/log/nginx
        depends_on:
            - php

    composer:
        image: imet-core_php_image
        depends_on:
            - php
        profiles:
            - development # this ensures the container is not created when launching "docker-compose up"
        volumes:
            - ./dev/:/var/www/html
            - ./:/var/www/html/package/imet-core
            - /var/www/html/package/imet-core/dev   # exclude dev from mounted
        entrypoint: [ 'composer' ]
          # NOTE:  It is possible to launch composer command using this container.
        # Ex. docker-compose run --rm composer update

    artisan:
        image: imet-core_php_image
        depends_on:
            - php
        profiles:
            - development
        volumes:
            - ./dev/:/var/www/html
            - ./:/var/www/html/package/imet-core
            - /var/www/html/package/imet-core/dev   # exclude dev from mounted
        entrypoint: [ 'php', 'artisan' ]


    npm:
        build:
            dockerfile: docker/node.dockerfile
            args:
                - UID=${UID-}
        volumes:
            - ./dev/:/var/www/html
            - ./:/var/www/html/package/imet-core
            - /var/www/html/package/imet-core/dev   # exclude dev from mounted
        profiles:
            - development
        ports:
            - "${VITE_PORT:-5173}:5173"
        environment:
            - VITE_URL=${VITE_URL}
        entrypoint: [ 'npm' ]
        #  docker-compose run --rm npm ....
        #  docker-compose run --rm --service-ports npm .... (for vite hrm)
